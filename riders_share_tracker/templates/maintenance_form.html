{% extends "base.html" %}
{% block title %}Log Maintenance{% endblock %}
{% block content %}
<form method="post">
  <div>
    <label>Bike</label>
    <select name="bike_id" required>
      {% for bike in bikes %}
      <option value="{{ bike.id }}">{{ bike.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="btn-row">
    <div style="flex:1">
      <label>Date</label>
      <input type="date" name="date" required>
    </div>
    <div style="flex:1">
      <label>Type</label>
      <select name="type">
        {% for t in ['oil_change', 'tires', 'brakes', 'chain', 'inspection', 'repair', 'other'] %}
        <option value="{{ t }}">{{ t|replace('_', ' ')|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="btn-row">
    <div style="flex:1">
      <label>Odometer (mi)</label>
      <input type="number" name="odometer">
    </div>
    <div style="flex:1">
      <label>Cost ($)</label>
      <input type="number" step="0.01" name="cost">
    </div>
  </div>
  <div class="btn-row">
    <div style="flex:1">
      <label>Next due date (optional)</label>
      <input type="date" name="next_due_date">
    </div>
    <div style="flex:1">
      <label>Next due odometer (optional)</label>
      <input type="number" name="next_due_odometer">
    </div>
  </div>
  <div>
    <label>Notes</label>
    <textarea name="notes"></textarea>
  </div>
  <div class="btn-row">
    <button type="submit" class="btn">Save</button>
    <a href="{{ url_for('maintenance_list') }}" class="btn secondary">Cancel</a>
  </div>
</form>
{% endblock %}
